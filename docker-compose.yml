version: "3.8"

services:
  maps-mcp:
    build: .
    container_name: maps-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - PORT=3000
    networks:
      - n8n_network

networks:
  n8n_network:
    external: true
    # Ganti "n8n_network" dengan nama network Docker tempat container n8n berjalan
    # (cek dengan perintah: docker network ls)
